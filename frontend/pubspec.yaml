name: craftstream
description: Artisan marketplace with low-bandwidth process videos.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  video_player: ^2.9.2
  video_player_web_hls: ^1.3.0   # HLS in Chrome via hls.js
  file_picker: ^8.1.2            # artisan picks the video to upload

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
