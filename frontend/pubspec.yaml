name: craftstream
description: Artisan marketplace with low-bandwidth process videos.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  video_player: ^2.9.2           # ExoPlayer on Android (web plays HLS with the bundled hls.js)
  file_picker: ^8.1.2            # artisan picks the video to upload
  web: ^1.1.1                    # browser File + <video> on web: chunked reads and the video length
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  yaml: ^3.1.4
  json_annotation: ^4.12.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.16.2
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/config/ui/
    - assets/config/catalog/
    - assets/config/media/
  # Bundled + subset by tools/subset_fonts.sh (Latin + ₹, ~170 KB total). Never fetched at runtime.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
