# yaml-language-server: $schema=../.schemas/dev/mock.schema.json
# MOCK_DATA=true (dev): the in-app fake backend, lib/data/mock/mock_store.dart. It follows the API's rules (search,
# paging, upload, activity log); this file holds its timing and its sample data. Read by mock_engine.
# Tests replace the store with one that has no delays (test/helpers/harness.dart).

# Delays that make loading states visible.
latency_ms: 450                # every call
chunk_delay_ms: 140            # each upload chunk
processing_seconds: 8          # a finished upload stays "processing" this long, then turns ready

# This device's artisan: the upload form starts with this name.
artisan_name: Meera Devi

# Stand-ins for what the API would say.
currency: INR                  # new listings
page_sizes: { products: 24, logs: 30 }   # when a call gives no limit
upload_policy:                 # GET /upload-policy
  max_duration_seconds: 900
  allowed_mime_types: [video/mp4, video/quicktime, video/webm, video/x-matroska, video/3gpp]
  chunk_size_bytes: 8388608    # 8 MiB
# mock:// addresses: player.yml plays its sample stream for any mock:// video. {id} is the product id.
hls_url: "mock://media/{id}/master.m3u8"
upload_url: "mock://uploads/{id}"

# A stand-in for backend/config/platform/activity_log.yml: each event's group, level and message.
log_events:
  listing_created: { group: upload, level: info, message: "Listing created; waiting for its video" }
  upload_received: { group: upload, level: info, message: "Video received" }
  transcode_submitted: { group: video, level: info, message: "Making the streaming versions (144p and up)" }
  transcode_succeeded: { group: video, level: info, message: "Video is live" }
  order_placed: { group: order, level: info, message: "Order placed" }
  upload_too_long: { group: upload, level: warning, message: "Video is longer than the limit; not uploaded" }
  upload_started: { group: upload, level: info, message: "Upload started" }
  upload_interrupted: { group: upload, level: warning, message: "Connection dropped; the upload will resume" }
  upload_resumed: { group: upload, level: info, message: "Upload resumed where the server had it" }
  upload_finished: { group: upload, level: info, message: "Upload finished" }
  upload_failed: { group: upload, level: error, message: "Upload failed" }
  upload_cancelled: { group: upload, level: info, message: "Upload cancelled" }

# What "pick a video" returns, in turn: one that fits the 15:00 limit and one that does not, so both paths show.
videos:
  - { name: clay-mug-process.mp4, size_bytes: 432013312, mime_type: video/mp4, seconds: 760 }
  - { name: loom-full-day.mov, size_bytes: 2254438400, mime_type: video/quicktime, seconds: 1085 }

# Sample listings. status is a video status (ui/status.yml); mine: true = this device's artisan owns it (Your
# products shows one live, one processing, one failed). created_at is local time. Search shows ready ones only.
