# Every route in the app. Each shows a screen YAML (`screen: home` -> ui/screens/home.yml).
#
#   path      absolute at the top level (`/orders`), relative under `routes:` (`buy` -> /product/:id/buy)
#   :name     a path parameter, passed to the screen (`/placed/:order_id` -> params.order_id)

initial: /

routes:
  - path: /
    screen: home
  - path: /orders
    screen: orders
  - path: /placed/:order_id
    screen: placed
  - path: /discover
    screen: discover
  - path: /studio
    screen: studio
  - path: /studio/new
    screen: upload
  - path: /logs
    screen: logs
    routes:
      - path: listing/:product_id
        screen: logs
  - path: /product/:id
    screen: product
    routes:
      - path: buy
        screen: checkout
