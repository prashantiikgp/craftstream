# The bricks screens are built from. A screen YAML (ui/screens/*.yml) lists bricks by name with their props;
# the brick's look (sizes, spacing, text styles, colours) lives here under `style`, so every screen that uses a
# brick looks the same. The Dart side (lib/shared/bricks/) only draws what this file describes.
#
# Prop types (what a screen may write):
#   text     a strings.yml key                  args     {placeholder: data path} for the text's {placeholders}
#   bind     a data path (`order.total`)         action   {go: /path/{item.id}} | {back: true} | {toggle_theme: true}
#   icon     a name from ui/icons.yml            role     a role from app/navigation.yml (buy, sell)
#   tone     a tone from ui/theme.yml            color    a colour from ui/theme.yml (`text_muted`, `pink.ink`)
#   style    a text style from ui/theme.yml      space    a spacing step from ui/theme.yml (sm, md, lg …)
#   door_art a door art name from ui/art.yml     enum     one of `options`
#   bool, number, node (one brick), nodes (a list of bricks), rows (receipt rows: label + field)
#
# Style values: spacing steps (`lg`), radius names (`sharp`, `card`), text styles (`eyebrow`), colours (`line`) or
# plain numbers (logical pixels).

bricks:
  text:
    about: One line or paragraph of copy in a theme text style.
    props:
      text: { type: text, required: true }
      args: { type: args }
      fallback: { type: text }       # shown instead when an arg is missing (e.g. no artisan name)
      style: { type: style, default: body }
      color: { type: color, default: text }
      align: { type: enum, options: [start, center, end], default: start }

  wordmark:
    about: The CraftStream stripes and name, with an optional tagline under it.
    props:
      size: { type: enum, options: [sm, lg], default: lg }
      tagline: { type: text }
    style:
      lg_mark: 44
      lg_name: h1
      sm_mark: 20
      sm_name: title
      compact_on: [compact]              # size classes where the large wordmark sits in one row to save height
      compact_mark: 30
      compact_name: h2
      gap: md
      tagline: eyebrow
      tagline_color: text_muted
      stripes: [orange, pink, purple]   # accents, left to right

  theme_toggle:
    about: Switches between light and dark. Shows a sun in dark mode and a moon in light mode.
    props:
      align: { type: enum, options: [start, end], default: end }
    style:
      box: 44
      icon: 20
      background: surface
      border: line
      radius: none
      icon_in_dark: sun                  # icons.yml names: where a tap takes you
      icon_in_light: moon

  doors:
    about: The Buy and Sell doors. Stacked and sharing the height on phones, side by side on wider screens.
    props:
      items: { type: nodes, required: true }
    style:
      gap: lg
      side_by_side_from: expanded        # a size class from ui/layout.yml (where screens with width: auto go wide)

  door:
    about: A big tappable box for one role. Lifts and glows in the role's colour on hover and press.
    props:
      role: { type: role, required: true }
      title: { type: text, required: true }
      body: { type: text }
      art: { type: door_art }            # defaults to the role's name
      action: { type: action, required: true }
    style:
      padding: xl
      gap: sm
      radius: card
      min_height: 150
      background: surface
      border: line
      number: eyebrow
      title: hero
      body: body
      body_lines: 2                      # the text never takes more than two lines
      body_color: text_muted
      body_width: 0.62                   # share of the door the text may use (keeps it clear of the door art)
      arrow_box: 36
      arrow_icon: 18
      arrow: arrow                       # icons.yml name
      compact_on: [compact]              # phones: a smaller title and padding so Home fits one screen
      compact_title: h1
      compact_padding: lg

  link_row:
    about: A full-width row that leads somewhere, with an icon and an optional count (Your orders · 3 →).
    props:
      icon: { type: icon, required: true }
      label: { type: text, required: true }
      count: { type: bind }
      tone: { type: tone, default: success }
      action: { type: action, required: true }
    style:
      height: 48
      padding: lg
      gap: sm
      icon: 20
      background: ground
      border: line
      label: body_strong
      count: price_sm

  top_bar:
    about: >-
      The bar at the top of an inner screen. Home or back on the left; on the right, where you are: a trail of
      crumbs (Buy / Hand-thrown clay mug / Checkout). Every crumb but the last leads back.
    props:
      leading: { type: enum, options: [home, back], default: home }
      action: { type: action, required: true }
      label: { type: text }              # next to the leading control (e.g. Home)
      role: { type: role }               # colours the crumbs that lead somewhere
      crumbs: { type: nodes }            # crumb bricks, outermost first
    style:
      height: 52
      padding: sm
      mark: 28
      icon: 22
      box: 44
      border: line
      label: h3
      label_color: text
      back_icon: back
      stripes: [orange, pink, purple]
      crumb: label
      crumb_current: text_muted
      separator: " / "
      separator_color: text_faint

  crumb:
    about: One step of the top bar's trail. Its text is a strings key, a role ("01 / BUY") or data (a title).
    props:
      text: { type: text }
      role: { type: role }
      bind: { type: bind }
      action: { type: action }           # none on the last crumb (where you are)

  mark:
    about: A filled square with an icon, used as a big status mark (the check on Order placed).
    props:
      icon: { type: icon, required: true }
      tone: { type: tone, default: brand }
    style:
      box: 64
      icon: 32
      stroke: 3

  receipt:
    about: An order receipt. Order number and status on top, then label/value rows, then the total.
    props:
      bind: { type: bind, required: true }      # an order: id, status, total, currency …
      number: { type: text, required: true }    # label for the order number
      rows: { type: rows }
      total: { type: text, required: true }     # label for the total
    style:
      padding: lg
      gap: sm
      background: surface
      border: line
      divider: line_strong
      label: eyebrow
      label_color: text_muted
      number: price_sm
      tag: eyebrow
      row_label: body
      row_label_color: text_muted
      row_value: body_strong
      total_value: price

  button:
    about: A full-width action. Primary is filled in the tone's colour; ghost is outlined.
    props:
      label: { type: text, required: true }
      icon: { type: icon }
      variant: { type: enum, options: [primary, ghost], default: primary }
      tone: { type: tone, default: brand }
      enabled: { type: bind }                    # when the bound value is false the button is greyed out
      busy: { type: bind }                       # while true the button shows a spinner and does nothing
      action: { type: action, required: true }
    style:
      height: 54
      gap: sm
      padding: lg                                # inside the button, around a long label
      icon: 18
      radius: sharp
      label: title
      ghost_border: line_strong
      ghost_background: surface
      spinner: 18
      spinner_stroke: 2

  list:
    about: Repeats one brick for every item of a bound list; inside it, `item` is the current entry.
    props:
      bind: { type: bind, required: true }
      item: { type: node, required: true }
      gap: { type: space, default: md }
      layout: { type: enum, options: [stack, cards], default: stack }   # cards: columns from layout.yml list_card

  order_card:
    about: One placed order. Poster, product, quantity and artisan, total and status; the order number below.
    props:
      bind: { type: bind, default: item }
      line: { type: text, required: true }     # e.g. orders.line: "{quantity} × · from {artisan}"
      args: { type: args }                     # fills the line's placeholders
      number: { type: text, required: true }   # e.g. orders.number: "#{id}"
      action: { type: action }
    style:
      padding: md
      gap: md
      poster: 64
      background: surface
      border: line
      highlight_first: true                  # the newest order gets its tone's border
      title: title
      title_lines: 2
      line_style: caption
      line_color: text_muted
      total: price_sm
      tag: eyebrow
      footer: mono
      footer_color: text_muted
      divider: line_strong

  empty_state:
    about: Nothing to show yet, with one way forward.
    props:
      icon: { type: icon, required: true }
      title: { type: text, required: true }
      message: { type: text }
      button: { type: text }
      action: { type: action }
    style:
      padding: xxl
      gap: md
      icon_box: 64
      icon: 28
      icon_background: neutral.wash
      icon_color: text_muted
      title: h3
      message: body
      message_color: text_muted

  search_field:
    about: The search box. Sends its text through `action` once typing pauses (or on Enter); has a clear button.
    props:
      bind: { type: bind, required: true }       # the current text, so the box follows other changes
      hint: { type: text, required: true }
      clear: { type: text, required: true }      # label of the clear button (screen readers)
      debounce: { type: bind, required: true }   # milliseconds to wait after the last keystroke
      action: { type: action, required: true }   # a {call: …}; gets the text
    style:
      height: 46
      padding: md
      gap: sm
      icon: 18
      search_icon: search
      clear_icon: close
      background: surface
      border: line_strong
      focus: brand.line
      radius: sharp
      text: body
      hint: text_faint
      icon_color: text_muted

  chip_row:
    about: A row of tag chips that scrolls sideways, starting with "All". One can be selected.
    props:
      bind: { type: bind, required: true }       # list of {value, selected}
      all: { type: text, required: true }
      all_selected: { type: bind, required: true }
      action: { type: action, required: true }   # e.g. {call: toggle_tag, with: item.value}; All passes null
    style:
      gap: xs
      height: 34
      padding: md
      label: eyebrow
      tone: brand                                # selected chip fill
      background: surface
      border: line_strong
      radius: sharp

  results_bar:
    about: How many results there are (and the tag filter in use), with the sort menu on the right.
    props:
      bind: { type: bind, required: true }       # {loading, count, has_more, tag}
      searching: { type: text, required: true }
      one: { type: text, required: true }
      many: { type: text, required: true }       # "{count} pieces"
      more: { type: text, required: true }       # "{count} pieces shown, more to see"
      tag: { type: text, required: true }        # "#{tag}"
      sorts: { type: bind, required: true }      # list of {value, label (strings key), selected}
      sort_label: { type: text, required: true }
      action: { type: action, required: true }   # a {call: …}; gets the chosen sort's value
    style:
      gap: sm
      count: caption
      count_color: text_muted
      tag_style: eyebrow
      tag_tone: brand
      sort_icon: sort
      sort_icon_size: 16
      sort_style: label
      sort_color: text_muted
      menu_style: body

  product_grid:
    about: Product cards in a grid (columns from ui/layout.yml). Posters only, never video. Skeletons while loading.
    props:
      bind: { type: bind, required: true }       # list of products (ProductSummary fields)
      loading: { type: bind, required: true }
      video_tag: { type: text, required: true }  # the small "Process video" tag on each poster
      action: { type: action, required: true }   # e.g. {go: /product/{item.id}}
    style:
      padding: sm
      gap: xxs
      background: surface
      border: line
      title: title
      title_lines: 2
      artisan: caption
      artisan_color: text_muted
      price: price_sm
      price_color: marigold.ink
      tag: eyebrow
      tag_background: scrim
      tag_color: on_scrim
      tag_icon: play
      tag_icon_size: 10
      tag_inset: sm
      skeleton: surface_alt
      skeleton_rows: 2

  load_more:
    about: Fetches the next page on request (no auto-loading on slow networks). Keeps the results when it fails.
    props:
      bind: { type: bind, required: true }       # {loading, failed}
      label: { type: text, required: true }
      retry: { type: text, required: true }
      error: { type: text, required: true }      # shown above the button when a page failed
      action: { type: action, required: true }
    style:
      height: 48
      gap: sm
      label: label
      background: surface
      border: line_strong
      error: caption
      error_color: danger.ink
      spinner: 18
      spinner_stroke: 2

  split:
    about: Two columns side by side on wide screens (layout.yml product_layout), stacked on phones and tablets.
    props:
      first: { type: nodes, required: true }     # the video column
      second: { type: nodes, required: true }    # the details column
      gap: { type: space, default: lg }          # between bricks in a column (and between columns when stacked)
      side_gap: { type: space, default: xxl }    # between the columns when side by side
    style:
      flex_scale: 100                            # turns layout.yml side_by_side_video_fraction into flex values

  value:
    about: A piece of data shown as text (a product's title or description), in a theme text style.
    props:
      bind: { type: bind, required: true }
      style: { type: style, default: body }
      color: { type: color, default: text }

  tag_row:
    about: A product's tags as outlined chips in rotating accents. Tapping one passes it to `action` as item.
    props:
      bind: { type: bind, required: true }       # list of tag strings
      action: { type: action }
    style:
      gap: xs
      height: 30
      padding: sm
      label: eyebrow
      background: surface
      accents: [orange, purple, pink, marigold]

  artisan_row:
    about: Who made it (initials square, name, a caption) with the price on the right, between hairlines.
    props:
      name: { type: bind, required: true }
      caption: { type: text, required: true }
      price: { type: bind, required: true }
      currency: { type: bind, required: true }
    style:
      padding: md
      gap: md
      border: line
      avatar: 40
      avatar_accent: pink
      avatar_style: price_sm
      initials: 2
      name_style: body_strong
      caption_style: caption
      caption_color: text_muted
      price_style: price
      price_color: marigold.ink

  notice:
    about: A tinted box with an icon, a title and a message, in a tone (info, warning, danger, success).
    props:
      tone: { type: tone, default: info }
      icon: { type: icon, default: info }
      title: { type: text, required: true }
      message: { type: text }
      args: { type: args }
      detail: { type: bind }                     # text from the data (e.g. the API's error); replaces message
    style:
      padding: lg
      gap: sm
      icon: 20
      title: label
      message: body

  buy_bar:
    about: The price and a Buy button, pinned to the bottom of the screen on phones so buying is one tap away.
    props:
      price: { type: bind, required: true }
      currency: { type: bind, required: true }
      label: { type: text, required: true }
      enabled: { type: bind, required: true }    # false: the button is greyed out and does nothing
      tone: { type: tone, default: brand }
      action: { type: action, required: true }
    style:
      gap: md
      height: 52
      button_width: 180
      price: price
      price_color: text
      label: title

  video_player:
    about: >-
      The process video for slow connections. Nothing loads until play is tapped; it starts on the lowest rung
      (media/player.yml) and a pill shows the rung ("144p · 47 kbps"). Tap the picture to pause.
    props:
      bind: { type: bind, required: true }       # a product: id, hls_url, thumbnail_url, ready
      play: { type: text, default: product.play }
      pause: { type: text, default: product.pause }
      slow_note: { type: text, default: product.slow_network_note }
      rung: { type: text, default: product.rung }
      rung_height_only: { type: text, default: product.rung_height_only }
      estimate: { type: text, default: product.network_estimate }
      buffering: { type: text, default: product.buffering }
      error: { type: text, default: product.video_error }
      retry: { type: text, default: common.retry }
      seek: { type: text, default: product.seek }
      time: { type: text, default: product.time }
    style:
      aspect_w: 16
      aspect_h: 9
      background: scrim
      bar: scrim
      on_bar: on_scrim
      panel: surface
      accent: brand.fill
      on_accent: brand.on_fill
      inset: md
      pill_padding: sm
      pill_gap: xs
      pill_icon: 14
      pill_icon_name: signal
      pill_icon_color: brand.fill
      pill_style: mono
      estimate_icon: gauge
      play_box: 64
      play_icon: play
      play_icon_size: 28
      pause_icon: pause
      retry_icon: retry
      control_box: 44
      control_icon: 18
      track: 3
      track_color: text_muted
      thumb: 6
      time_style: mono
      spinner: 28
      spinner_stroke: 3
      error_max_width: 320
      error_padding: lg
      error_style: body

  product_summary:
    about: A small card for the product being ordered. Poster, title, who made it and the unit price.
    props:
      bind: { type: bind, required: true }       # a product
      artisan: { type: text, required: true }    # e.g. product.by_artisan: "by {artisan}"
      each: { type: text, required: true }       # e.g. checkout.each: "{price} each"
    style:
      padding: md
      gap: md
      poster: 64
      background: surface
      border: line
      title: title
      title_lines: 2
      artisan: caption
      artisan_color: text_muted
      each: price_sm
      each_color: marigold.ink

  text_field:
    about: A labelled text input. Sends each change through `action`; shows the source's error under it.
    props:
      label: { type: text, required: true }
      hint: { type: text, required: true }
      bind: { type: bind, required: true }       # the current text
      error: { type: bind }                      # {key, args} from the source, or null
      lines: { type: number, default: 1 }        # more than 1: a multi-line box
      prefix: { type: text }                     # shown inside the box before the text (e.g. ₹)
      helper: { type: text }                     # a hint under the box
      helper_args: { type: args }
      keyboard: { type: enum, options: [text, decimal], default: text }
      action: { type: action, required: true }   # a {call: …}; gets the text
    style:
      gap: sm
      padding: md
      label: eyebrow
      label_color: text_muted
      text: body
      hint: text_faint
      background: surface
      border: line_strong
      focus: brand.line
      error: caption
      error_color: danger.ink
      radius: sharp
      prefix_style: title
      prefix_color: marigold.ink

  stepper:
    about: − value + within limits (the buttons stop at min and max), with an optional limit note beside it.
    props:
      bind: { type: bind, required: true }
      min: { type: bind, required: true }
      max: { type: bind, required: true }
      less: { type: text, required: true }       # button labels for screen readers
      more: { type: text, required: true }
      limit: { type: text }                      # e.g. checkout.quantity_limit: "Up to {max} per order"
      action: { type: action, required: true }   # a {call: …}; gets the new value
    style:
      height: 48
      button: 44
      icon: 16
      less_icon: minus
      more_icon: plus
      value_width: 36
      value: price_sm
      background: surface
      border: line_strong
      disabled: text_faint
      gap: md
      limit: caption
      limit_color: text_muted

  amount_row:
    about: A label and an amount of money, under a hairline (the order total).
    props:
      label: { type: text, required: true }
      bind: { type: bind, required: true }
      currency: { type: bind, required: true }
    style:
      padding: lg
      border: line
      label: eyebrow
      label_color: text_muted
      amount: price
      amount_color: marigold.ink

  listing_card:
    about: >-
      One of the artisan's products: poster, title, price and its video status from ui/status.yml (tag, hint,
      a progress bar while processing, "Upload again" when it failed). Opens the product once it is live.
    props:
      bind: { type: bind, default: item }        # a product (models/product.yml fields)
      role: { type: role, required: true }       # its accent colours the card
      open: { type: action }                     # e.g. {go: /product/{item.id}}; only when orderable
      retry: { type: action }                    # e.g. {go: /studio/new}; only when status.yml says retry
      retry_label: { type: text, required: true }
    style:
      padding: md
      gap: md
      poster: 72
      background: surface
      border: line
      title: title
      title_lines: 2
      tag: eyebrow
      price: price_sm
      price_color: marigold.ink
      hint: caption
      hint_color: text_muted
      bar: 4
      bar_track: line
      retry_style: label

  tag_picker:
    about: Tags to choose for a product; several can be on. Each passes its value to `action` as item.value.
    props:
      bind: { type: bind, required: true }       # list of {value, selected}
      role: { type: role, required: true }
      action: { type: action, required: true }
    style:
      gap: xs
      height: 34
      padding: sm
      label: price_sm
      background: surface
      border: line_strong

  video_pick:
    about: >-
      Choose the process video. Before: a big area with Choose video and the length limit; after: its name, size
      and length with Change. The length check is shown by notices in the screen YAML.
    props:
      bind: { type: bind, required: true }       # {picked, missing, name, details, max}
      role: { type: role, required: true }
      label: { type: text, required: true }
      empty_title: { type: text, required: true }
      empty_message: { type: text, required: true }   # "Up to {max} long …"
      empty_loading: { type: text, required: true }   # before the limit is known
      choose: { type: text, required: true }
      change: { type: text, required: true }
      required: { type: text, required: true }        # shown when Publish is tapped without a video
      action: { type: action, required: true }        # a {call: …} that opens the picker
    style:
      gap: sm
      padding: md
      area_padding: xl
      label_style: eyebrow
      label_color: text_muted
      icon: video
      icon_size: 32
      title: title
      message: caption
      message_color: text_muted
      details: mono
      button: label
      background: surface
      border: line_strong
      file_box: 44
      file_icon: 22
      file_accent: purple

  progress_bar:
    about: A bar for a bound fraction (0–1). With `indeterminate` true it moves without a value.
    props:
      bind: { type: bind, required: true }
      indeterminate: { type: bind }
      role: { type: role }                       # colour from the role's accent, else from tone
      tone: { type: tone, default: brand }
      size: { type: enum, options: [thin, thick], default: thick }
    style:
      thin: 4
      thick: 8
      track: line

  steps:
    about: Numbered steps. Done ones get a check, the current one is filled in the role's colour.
    props:
      items: { type: steps, required: true }     # [{title, note}] strings keys
      bind: { type: bind, required: true }       # index of the current step
      role: { type: role, required: true }
    style:
      dot: 24
      icon: 14
      line: 1
      gap: md
      row_gap: md
      number: eyebrow
      title: title
      note: caption
      note_color: text_muted
      background: ground
      border: line_strong
      done_tone: success
      done_icon: check

  burst:
    about: >-
      A one-shot celebration (the client portal's celebration_burst): small squares in the accent colours fly out
      from behind its item and fade. Plays once when the screen opens; skipped when the device asks for less motion.
    props:
      item: { type: node, required: true }
    style:
      pieces: 28
      piece: 7                           # px, a square piece
      distance: [60, 150]                # px each piece flies, min and max
      spin: 340                          # degrees each piece turns
      duration_ms: 900
      accents: [orange, pink, purple, marigold]

  spacer:
    about: "Takes the free height, pushing what follows to the bottom (only inside a screen with `fill: true`)."
    props: {}
