# yaml-language-server: $schema=../.schemas/ui/theme.schema.json
# CraftStream design tokens: theme B ("two doors"). Sharp corners, Space Grotesk + Space Mono, artistic accents
# (orange, pink, purple, marigold) on a near-black purple (dark) or #F5F5F5 grey (light) ground.
# Read by theme_engine; nothing in a brick or screen may hard-code a colour, size, radius or duration.
#
# Every colour pair under `contrast:` is checked for WCAG contrast in both modes by theme_engine_test, so a
# combination that makes text hard to read fails the build.

# ── Colours ──────────────────────────────────────────────────────────────────────────────────────────────────
# Ground and text, per mode.
#   ground        page background            surface       cards, fields, bars
#   surface_alt   skeletons, inset areas      line / line_strong   hairlines / field borders and outlines
#   text          main text                   text_muted    secondary text (AA on ground and surface)
#   text_faint    placeholders only (decorative, never the only carrier of meaning)
#   scrim         behind the video and dialogs           on_scrim   text and icons placed on the scrim
colors:
  light:
    ground: "#F5F5F5"
    surface: "#FFFFFF"
    surface_alt: "#ECEAF0"
    line: "#DEDAE5"
    line_strong: "#C9C3D4"
    text: "#150F20"
    text_muted: "#57506A"
    text_faint: "#7A7290"
    scrim: "#150F20"
    on_scrim: "#FFFFFF"
  dark:
    ground: "#0F0B18"
    surface: "#19132A"
    surface_alt: "#221B36"
    line: "#33294D"
    line_strong: "#4A3F66"
    text: "#F6F2FC"
    text_muted: "#B4AACB"
    text_faint: "#8E84A6"
    scrim: "#000000"
    on_scrim: "#F6F2FC"

# Accents, per mode. Each has:
#   fill     shapes, filled buttons and badges     on_fill  text and icons placed on the fill
#   ink      coloured text on ground or surface    wash     tinted backgrounds (badges, notices)
#   line     outlines and focus rings
# Fills stay the same in both modes; inks are darker in light mode so coloured text stays readable.
accents:
  light:
    orange:   { fill: "#FF6A2B", on_fill: "#150F20", ink: "#B83D0B", wash: "#FFE6DA", line: "#FF6A2B" }
    pink:     { fill: "#FF4D94", on_fill: "#150F20", ink: "#B4145F", wash: "#FFE0EC", line: "#FF4D94" }
    purple:   { fill: "#9D6BFF", on_fill: "#150F20", ink: "#6D28D9", wash: "#EDE4FF", line: "#9D6BFF" }
    marigold: { fill: "#FFB627", on_fill: "#150F20", ink: "#8A5A00", wash: "#FFF1D1", line: "#FFB627" }
    neutral:  { fill: "#C9C3D4", on_fill: "#150F20", ink: "#57506A", wash: "#ECEAF0", line: "#C9C3D4" }
  dark:
    orange:   { fill: "#FF6A2B", on_fill: "#0F0B18", ink: "#FF8A57", wash: "#2E1A16", line: "#FF6A2B" }
    pink:     { fill: "#FF4D94", on_fill: "#0F0B18", ink: "#FF7AAE", wash: "#2E1424", line: "#FF4D94" }
    purple:   { fill: "#9D6BFF", on_fill: "#0F0B18", ink: "#BFA0FF", wash: "#211A3A", line: "#9D6BFF" }
    marigold: { fill: "#FFB627", on_fill: "#0F0B18", ink: "#FFC75A", wash: "#2B2212", line: "#FFB627" }
    neutral:  { fill: "#4A3F66", on_fill: "#F6F2FC", ink: "#B4AACB", wash: "#221B36", line: "#4A3F66" }

# What each meaning looks like. Bricks, notices and status badges ask for a tone, never a colour.
tones:
  brand: orange       # the main action (Buy, Place order)
  success: marigold   # live, placed, done
  danger: pink        # failed, errors
  info: purple        # processing, hints
  warning: orange     # connection lost, paused
  neutral: neutral    # waiting, disabled

# ── Type ─────────────────────────────────────────────────────────────────────────────────────────────────────
# Bundled and subset by tools/subset_fonts.sh (Latin + ₹); nothing is fetched at runtime.
fonts:
  sans: SpaceGrotesk   # UI text
  mono: SpaceMono      # eyebrows, prices, order numbers, counts (400 and 700 only)

# size px, weight, line height (multiple), letter spacing (em); upper: shown in capitals.
styles:
  hero:        { font: sans, size: 56, weight: 700, height: 1.0, tracking: -0.03 }  # the Buy / Sell words
  display:     { font: sans, size: 44, weight: 700, height: 1.0, tracking: -0.03 }  # "Order placed"
  h1:          { font: sans, size: 34, weight: 700, height: 1.05, tracking: -0.02 } # screen titles
  h2:          { font: sans, size: 26, weight: 700, height: 1.1, tracking: -0.02 }
  h3:          { font: sans, size: 18, weight: 700, height: 1.25, tracking: 0 }
  title:       { font: sans, size: 15, weight: 700, height: 1.3, tracking: 0 }      # card titles
  body:        { font: sans, size: 15, weight: 400, height: 1.5, tracking: 0 }
  body_strong: { font: sans, size: 15, weight: 600, height: 1.5, tracking: 0 }
  label:       { font: sans, size: 14, weight: 600, height: 1.3, tracking: 0 }      # buttons, field labels
  caption:     { font: sans, size: 13, weight: 400, height: 1.4, tracking: 0 }
  eyebrow:     { font: mono, size: 12, weight: 700, height: 1.2, tracking: 0.12, upper: true }  # 01 / BUY
  mono:        { font: mono, size: 12, weight: 400, height: 1.3, tracking: 0 }      # ids, dates, file sizes
  price:       { font: mono, size: 26, weight: 700, height: 1.1, tracking: 0 }
  price_sm:    { font: mono, size: 14, weight: 700, height: 1.2, tracking: 0 }

# ── Space, shape, depth, motion ──────────────────────────────────────────────────────────────────────────────
# 4-point spacing scale (logical pixels).
spacing: { xxs: 2, xs: 4, sm: 8, md: 12, lg: 16, xl: 24, xxl: 32, xxxl: 48, section: 64 }

# Sharp: buttons, chips, fields and badges use `sharp`; cards and doors use `card`.
radius: { none: 0, sharp: 2, card: 4 }

# Shadow layers. `accent` as a colour means the colour of the thing casting it (an orange door glows orange).
#   rest   cards at rest (flat: theme B separates with hairlines, not shadows)
#   lift   hover and press: the key-card shadow from the client dashboard (--sh-ant), tinted by the accent
#   float  menus and dialogs
shadows:
  light:
    rest: []
    lift:
      - { x: 0, y: 3, blur: 6, spread: -4, color: accent, opacity: 0.30 }
      - { x: 0, y: 6, blur: 16, spread: 0, color: accent, opacity: 0.16 }
      - { x: 0, y: 9, blur: 28, spread: 8, color: "#1F2A3D", opacity: 0.06 }
    float:
      - { x: 0, y: 8, blur: 24, spread: 0, color: "#150F20", opacity: 0.18 }
  dark:
    rest: []
    lift:
      - { x: 0, y: 3, blur: 6, spread: -4, color: accent, opacity: 0.35 }
      - { x: 0, y: 6, blur: 16, spread: 0, color: accent, opacity: 0.22 }
      - { x: 0, y: 9, blur: 28, spread: 8, color: "#9D6BFF", opacity: 0.12 }
    float:
      - { x: 0, y: 8, blur: 24, spread: 0, color: "#000000", opacity: 0.45 }

# Durations in ms; curves are cubic-bezier control points. Reduced motion = shorter, and no lift or press scale.
motion:
  durations: { fast: 150, medium: 350, slow: 600 }
  curves:
    smooth: [0.4, 0.0, 0.2, 1.0]
    out: [0.16, 1.0, 0.3, 1.0]
    in: [0.7, 0.0, 0.84, 0.0]
    spring: [0.34, 1.56, 0.64, 1.0]
  reduced_motion_factor: 0.3
  hover_lift: 2         # px a card rises on hover
  door_hover_lift: 3    # the Buy / Sell doors rise a little more
  press_scale: 0.985    # how far a pressed card sinks
  skeleton_pulse_ms: 1100
  skeleton_min_opacity: 0.55

# Focus and touch: keyboard focus ring and the smallest tap target (WCAG 2.5.8 / Android guidance).
focus: { ring_width: 2, ring_tone: brand, min_target: 44 }

# ── Readability checks ───────────────────────────────────────────────────────────────────────────────────────
# fg / bg name a colour (`text`, `ground`…) or, under each_accent, a part of every accent (`ink`, `wash`…).
# min: 7.0 body text (AAA), 4.5 normal text (AA), 3.0 large text and UI parts.
contrast:
  pairs:
    - { fg: text, bg: ground, min: 7.0, why: body text }
    - { fg: text, bg: surface, min: 7.0, why: body text on cards }
    - { fg: text_muted, bg: ground, min: 4.5, why: secondary text }
    - { fg: text_muted, bg: surface, min: 4.5, why: secondary text on cards }
    - { fg: text_muted, bg: surface_alt, min: 4.5, why: secondary text on inset areas }
    - { fg: line_strong, bg: surface, min: 1.4, why: field borders stay visible }
    - { fg: on_scrim, bg: scrim, min: 7.0, why: tags on posters and the video }
  each_accent:
    - { fg: ink, bg: ground, min: 4.5, why: coloured text }
    - { fg: ink, bg: surface, min: 4.5, why: coloured text on cards }
    - { fg: ink, bg: wash, min: 4.5, why: badge and notice text on its tint }
    - { fg: on_fill, bg: fill, min: 4.5, why: label on a filled button or badge }
