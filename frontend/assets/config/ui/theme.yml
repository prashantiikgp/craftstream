# CraftStream design tokens. Read by theme_engine; nothing in a screen may hard-code a colour, size or radius.
#
# Built on the Fluno client design system (hotel_agent/frontend/shared/design/tokens): same names, same orange,
# same warm surfaces. Fixes carried over: one naming layer, a real type + spacing scale, dark values for everything.
#
# Palettes are swappable: env/<name>.json picks one (THEME_PALETTE); with DEV_TOOLS on, /catalog switches live.
# Every palette is checked by test/domain/ui/theme_engine_test.dart for WCAG contrast, so experiment freely:
# a combination that makes text hard to read fails the build.
#
# Colour names (from the Fluno system):
#   brand        fills (buttons, active pills)       brand_d / brand_dd  hover / pressed
#   brand_ink    orange TEXT (fill orange fails AA)  brand_l / brand_ll  tint / wash backgrounds
#   brand_line   hairline in brand colour            on_brand            text/icons placed on a brand fill
#   secondary*   the second colour (tags, highlights, illustrations); same suffix rules

default_palette: saffron

palettes:
  saffron:
    label: Saffron (Fluno orange)
    light:
      brand: "#FE5722"
      brand_d: "#E64A19"
      brand_dd: "#BF360C"
      brand_ink: "#C2410C"
      brand_l: "#FFE3D9"
      brand_ll: "#FFF4F0"
      brand_line: "#FFCDBC"
      on_brand: "#FFFFFF"
      secondary: "#F32B86"
      secondary_ink: "#B4145F"
      secondary_l: "#FDE1EE"
      on_secondary: "#FFFFFF"
    dark:
      brand: "#FF7043"
      brand_d: "#FE5722"
      brand_dd: "#FFAB91"
      brand_ink: "#FE9776"
      brand_l: "#3A2418"
      brand_ll: "#241A16"
      brand_line: "#6E301F"
      on_brand: "#16181D"
      secondary: "#F76BAA"
      secondary_ink: "#FAA0C9"
      secondary_l: "#471C34"
      on_secondary: "#16181D"

  terracotta:
    label: Terracotta + indigo dye
    light:
      brand: "#C8553D"
      brand_d: "#B44C37"
      brand_dd: "#96402E"
      brand_ink: "#9A3A26"
      brand_l: "#F6E4E0"
      brand_ll: "#FCF5F3"
      brand_line: "#EECCC5"
      on_brand: "#FFFFFF"
      secondary: "#3B4BA0"
      secondary_ink: "#2F3C86"
      secondary_l: "#E4E6F2"
      on_secondary: "#FFFFFF"
    dark:
      brand: "#D27460"
      brand_d: "#C8553D"
      brand_dd: "#E4AA9E"
      brand_ink: "#DD9687"
      brand_l: "#3A2423"
      brand_ll: "#281E20"
      brand_line: "#5A2F29"
      on_brand: "#16181D"
      secondary: "#7681BC"
      secondary_ink: "#A7AED4"
      secondary_l: "#1E233A"
      on_secondary: "#16181D"

  marigold:
    label: Marigold + peacock teal
    light:
      brand: "#F28C18"
      brand_d: "#DA7E16"
      brand_dd: "#B66912"
      brand_ink: "#A45708"
      brand_l: "#FDEDDA"
      brand_ll: "#FEF8F1"
      brand_line: "#FBDCBA"
      on_brand: "#241A16"   # white on marigold is only 2.5:1
      secondary: "#0F766E"
      secondary_ink: "#0B5E57"
      secondary_l: "#DDECEB"
      on_secondary: "#FFFFFF"
    dark:
      brand: "#F4A142"
      brand_d: "#F28C18"
      brand_dd: "#F8C68C"
      brand_ink: "#F7B870"
      brand_l: "#422F1C"
      brand_ll: "#2C241C"
      brand_line: "#6A441B"
      on_brand: "#16181D"
      secondary: "#579F9A"
      secondary_ink: "#93C1BE"
      secondary_l: "#142D2F"
      on_secondary: "#16181D"

# Surfaces and text: shared by every palette (warm paper in light, warm charcoal in dark).
surfaces:
  light:
    bg: "#FAF6F4"           # page
    card: "#FFFFFF"
    surface_soft: "#F4EEEA" # inset areas, skeletons
    hair: "#E7DFDA"         # borders, dividers
    hair_soft: "#F0EAE6"
    ink: "#383838"          # main text
    sub: "#707070"          # secondary text (AA on bg and card)
    faint: "#A8A8A8"        # placeholders, disabled: decorative only, never the only carrier of meaning
    scrim: "#15110F"        # behind dialogs and the video player
  dark:
    bg: "#16181D"
    card: "#1E212A"
    surface_soft: "#1B1E25"
    hair: "#332B27"
    hair_soft: "#272C38"
    ink: "#ECEAE6"
    sub: "#A99E97"
    faint: "#6E7482"
    scrim: "#000000"

# Status colours: fill / border / ink (text) / wash (background tint). In dark, wash and ink swap roles.
semantic:
  light:
    success: { fill: "#22C55E", border: "#16A34A", ink: "#15803D", wash: "#DCFCE7" }
    danger:  { fill: "#EF4444", border: "#FECACA", ink: "#991B1B", wash: "#FEE2E2" }
    info:    { fill: "#3B82F6", border: "#BFDBFE", ink: "#1E40AF", wash: "#DBEAFE" }
    warning: { fill: "#F59E0B", border: "#F4B68C", ink: "#805500", wash: "#FFE7AE" }
  dark:
    success: { fill: "#2ECC71", border: "#1F5133", ink: "#6EE7A0", wash: "#13291D" }
    danger:  { fill: "#F26060", border: "#5C2626", ink: "#FCA5A5", wash: "#2C1618" }
    info:    { fill: "#5B96F7", border: "#25406B", ink: "#93C0FD", wash: "#15213A" }
    warning: { fill: "#F0B429", border: "#5A431C", ink: "#F0CE7A", wash: "#3A2F14" }

# Fonts are bundled (assets/fonts, Latin + ₹ subset, ~170 KB total); nothing is fetched at runtime.
typography:
  heading_family: Poppins
  body_family: Inter
  # size px, weight, line height (multiple), letter spacing (em)
  styles:
    display:  { family: heading, size: 34, weight: 700, height: 1.15, tracking: -0.02 }
    h1:       { family: heading, size: 28, weight: 700, height: 1.2, tracking: -0.01 }
    h2:       { family: heading, size: 22, weight: 600, height: 1.25, tracking: 0 }
    h3:       { family: heading, size: 18, weight: 600, height: 1.3, tracking: 0 }
    title:    { family: body, size: 16, weight: 600, height: 1.4, tracking: 0 }
    body:     { family: body, size: 15, weight: 400, height: 1.5, tracking: 0 }
    body_strong: { family: body, size: 15, weight: 500, height: 1.5, tracking: 0 }
    label:    { family: body, size: 14, weight: 600, height: 1.3, tracking: 0.01 }
    caption:  { family: body, size: 12, weight: 500, height: 1.4, tracking: 0.02 }
    price:    { family: heading, size: 20, weight: 700, height: 1.2, tracking: 0 }

# 4-point spacing scale (logical pixels).
spacing: { xxs: 2, xs: 4, sm: 8, md: 12, lg: 16, xl: 24, xxl: 32, xxxl: 48, section: 64 }

radius: { tag: 7, sm: 8, md: 14, lg: 22, pill: 999 }

# Warm-tinted shadows (light) and plain black (dark). Each level is a list of layers.
elevation:
  light:
    sm:
      - { x: 0, y: 1, blur: 2, spread: 0, color: "#32190F", opacity: 0.05 }
      - { x: 0, y: 6, blur: 20, spread: 0, color: "#32190F", opacity: 0.06 }
    lg:
      - { x: 0, y: 2, blur: 6, spread: 0, color: "#32190F", opacity: 0.07 }
      - { x: 0, y: 18, blur: 50, spread: 0, color: "#32190F", opacity: 0.11 }
  dark:
    sm:
      - { x: 0, y: 1, blur: 2, spread: 0, color: "#000000", opacity: 0.30 }
      - { x: 0, y: 6, blur: 20, spread: 0, color: "#000000", opacity: 0.35 }
    lg:
      - { x: 0, y: 2, blur: 6, spread: 0, color: "#000000", opacity: 0.40 }
      - { x: 0, y: 18, blur: 50, spread: 0, color: "#000000", opacity: 0.50 }

# Durations in ms; curves are cubic-bezier control points. Reduced motion = shorter, not none.
motion:
  durations: { fast: 150, medium: 350, slow: 600 }
  curves:
    smooth: [0.4, 0.0, 0.2, 1.0]
    out: [0.16, 1.0, 0.3, 1.0]
    in: [0.7, 0.0, 0.84, 0.0]
    spring: [0.34, 1.56, 0.64, 1.0]
  reduced_motion_factor: 0.3
