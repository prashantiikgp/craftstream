# The API contract and the only place routes are declared. `make gen` turns `endpoints` into the Flutter API
# client, and every endpoint into a row of backend/app/generated/api.py, from which the API mounts its handlers
# by `name` (app/api/endpoints.py): method, path, success status, query limits and whether /docs shows it all
# come from here. Every error response uses the ErrorResponse model.
#
# Query params: `name: {type: string|integer, max_length: n, minimum: n, maximum: n}` (limits optional).

base_path: /api/v1

# Public endpoints: called by the app. Paths are relative to base_path.
endpoints:
  - name: createProduct
    method: POST
    path: /products
    body: ProductCreate
    returns: UploadTicket
    status: 201
    summary: Create a listing and get a resumable upload URL for its video.

  - name: listProducts
    method: GET
    path: /products
    query:
      q: {type: string, max_length: 200}       # keywords over title, description, tags (rules in catalog/search.yml)
      tag: {type: string, max_length: 50}      # exact tag filter
      cursor: {type: string, max_length: 100}  # next_cursor from the previous page
      limit: {type: integer, minimum: 1}       # page size (capped by the server)
    returns: ProductPage
    status: 200
    summary: Search and filter products whose video is ready, one page at a time.

  - name: getProduct
    method: GET
    path: /products/{product_id}
    returns: Product
    status: 200
    summary: Product details with video status and HLS URL (poll this while the video processes).

  - name: listTags
    method: GET
    path: /tags
    returns: TagList
    status: 200
    summary: Tags for the filter chips.

  - name: getUploadPolicy
    method: GET
    path: /upload-policy
    returns: UploadPolicy
    status: 200
    summary: Limits to check on the device before uploading (15-min cap, file types, chunk size).

  - name: createOrder
    method: POST
    path: /orders
    body: OrderCreate
    returns: Order
    status: 201
    summary: Place an order. The flow ends here.

  - name: getOrder
    method: GET
    path: /orders/{order_id}
    returns: Order
    status: 200
    summary: One order, so a device can show its orders after a restart (it keeps only their ids).

  - name: listLogs
    method: GET
    path: /logs
    query:
      group: {type: string, max_length: 20}        # upload | video | order | system
      level: {type: string, max_length: 20}        # info | warning | error
      product_id: {type: string, max_length: 100}  # one listing's steps
      cursor: {type: string, max_length: 100}      # next_cursor from the previous page
      limit: {type: integer, minimum: 1}           # page size (capped by the server)
    returns: LogPage
    status: 200
    summary: The activity log, newest first, optionally narrowed to a group, level or listing.

  - name: createLog
    method: POST
    path: /logs
    body: LogEntryCreate
    returns: LogEntry
    status: 201
    summary: The app reports an upload step only it sees (started, network dropped, resumed, finished, failed).

# Not called by the app, so not in the Dart client or /docs. Full paths (no base_path).
# `mode: local` mounts the endpoint only when CRAFTSTREAM_MODE=local.
internal:
  - name: health
    method: GET
    path: /health
    status: 200
    summary: Liveness check for Cloud Run (not /healthz, which Google's front end reserves).

  - name: localUpload
    method: PUT
    path: /local-upload/{product_id}
    status: 200
    mode: local
    summary: Local mode only. Fake GCS resumable upload target (Content-Range chunks, 308 until complete).

  - name: mediaUploaded
    method: POST
    path: /internal/media/uploaded
    status: 204
    summary: Eventarc (GCS object finalized) -> start transcoding. OIDC-authenticated.

  - name: mediaTranscoded
    method: POST
    path: /internal/media/transcoded
    status: 204
    summary: Pub/Sub push (Transcoder job finished) -> mark the video ready or failed. OIDC-authenticated.
