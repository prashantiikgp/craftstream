# ErrorResponse: the one shape every error from the API takes (4xx and 5xx).

model: ErrorResponse
description: The body of every error response.

fields:
  code:
    type: string
    # Every code and its HTTP status: backend/config/api/http.yml (a test checks this list against it).
    description: >-
      machine-readable: bad_request, unauthorized, forbidden, log_event_not_reportable, not_found,
      method_not_allowed, conflict, product_not_ready, unsupported_media_type, validation_error,
      unknown_log_event, internal_error
  message:
    type: string
    description: human-readable summary
  details:
    type: array
    items: string
    default: []
    description: one entry per problem, e.g. "body.price - Input should be greater than or equal to 0.01"
